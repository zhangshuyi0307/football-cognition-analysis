<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>气球挑战 - BELT</title>
    <style>
        * { user-select: none; touch-action: manipulation; box-sizing: border-box; caret-color: transparent !important; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #333; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .experiment-container { position: relative; width: 100vw; height: 100vh; background: #fff; overflow: hidden; display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 1; }
        .button-left { position: absolute; bottom: 40px; left: 50px; z-index: 20; pointer-events: auto; }
        .button-right { position: absolute; bottom: 40px; right: 50px; z-index: 20; pointer-events: auto; }
        .big-btn { background: #2c3e66; border: none; border-radius: 80px; padding: 20px 50px; font-size: 2rem; font-weight: bold; color: white; box-shadow: 0 8px 0 #1a2a44; transition: 0.05s linear; cursor: pointer; width: 220px;}
        .big-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #1a2a44; }
        .big-btn.red { background: #d32f2f; box-shadow: 0 8px 0 #8e0000; }
        .big-btn.red:active { box-shadow: 0 0 0 #8e0000; }
        .big-btn:disabled { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
        #unified-instruction-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 40px; }
        .header-area { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 180px 1fr 180px; align-items: center; margin-bottom: 20px; }
        .instruction-header { grid-column: 2; justify-self: center; text-align: center; font-size: 2rem; font-weight: bold; color: #4DA3FF; letter-spacing: 2px; margin: 0; }
        .guide-nav-btn { padding: 12px 32px; font-size: 1.4rem; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .guide-prev-btn { grid-column: 1; justify-self: start; background: #64748b; }
        .guide-next-btn { grid-column: 3; justify-self: end; background: #4DA3FF; }
        .guide-prev-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .next-step-btn { padding: 12px 32px; font-size: 1.4rem; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; background: #4DA3FF; }
        .images-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 1000px; margin-bottom: 20px; position: relative; }
        .guide-img-wrapper { padding: 10px; border-radius: 12px; background: #f0f4f8; border: 1px solid #ccc; transition: opacity 0.4s, transform 0.4s; opacity: 0.3; display: flex; justify-content: center; align-items: center;}
        .guide-img-wrapper.active { opacity: 1; transform: scale(1.03); background: #e2e8f0; border-color: #0f3689; z-index: 5;}
        .guide-img-wrapper img { max-height: 28vh; width: auto; max-width: 100%; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); display: block; }
        #dynamic-red-box { position: absolute; border: 4px solid #FF3366; border-radius: 16px; pointer-events: none; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 0 25px rgba(255, 51, 102, 0.3); display: none; z-index: 10; }
        .subtitle-container { width: 100%; max-width: 1000px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 15px; padding: 20px 30px; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .subtitle-text { font-size: 1.4rem; line-height: 1.5; color: #333; margin: 0; transition: opacity 0.3s; }
        .simple-overlay { position: fixed; inset: 0; background: #fff; z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; color: #333; }
        .py-style-btn { margin-top: 50px; background: #003399; border: none; border-radius: 12px; padding: 15px 60px; font-size: 1.8rem; font-weight: bold; color: white; cursor: pointer; transition: background 0.2s; box-shadow: inset 0 0 10px rgba(255,255,255,0.2); }
        .py-style-btn:hover { background: #0044cc; }
        .rating-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .rating-num { width: 75px; height: 75px; background: #f8fafc; color: #334155; font-size: 28px; font-weight: bold; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #e2e8f0; transition: 0.1s; }
    </style>
</head>
<body>
    <div id="unified-instruction-overlay" style="display:none;">
        <div class="header-area"><button class="guide-nav-btn guide-prev-btn" id="guide-prev-btn" type="button">上一步</button><div class="instruction-header">【气球挑战】规则说明</div><button class="guide-nav-btn guide-next-btn next-step-btn" id="guide-next-btn" type="button">下一步</button></div>
        <div class="images-grid" id="instruction-content">
            <div id="dynamic-red-box"></div>
            <div class="guide-img-wrapper" id="img-target-1"><img src="./pagev1.png" onerror="this.style.display='none'"></div>
            <div class="guide-img-wrapper" id="img-target-2"><img src="./pagev2.png" onerror="this.style.display='none'"></div>
            <div class="guide-img-wrapper" id="img-target-3"><img src="./pagev3.png" onerror="this.style.display='none'"></div>
            <div class="guide-img-wrapper" id="img-target-4"><img src="./pagev4.png" onerror="this.style.display='none'"></div>
        </div>
        <div class="subtitle-container"><p class="subtitle-text" id="subtitle-text"></p></div>
    </div>
    <div class="experiment-container" id="exp-container">
        <canvas id="game-canvas"></canvas>
        <div class="button-right"><button class="big-btn" id="pumpBtn">🎈 打气</button></div>
        <div class="button-left"><button class="big-btn red" id="cashBtn">💰 存分</button></div>
    </div>

<script src="./bart_sequence.js"></script>
<script src="./bart.js"></script>
</body>
</html>
