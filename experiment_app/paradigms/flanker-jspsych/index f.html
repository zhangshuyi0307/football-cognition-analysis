<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>箭头判断 - Flanker - 冲突监控</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; caret-color: transparent !important; box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', "Microsoft YaHei", sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; touch-action: manipulation; color: white; }
        .stimulus-area { flex: 3; display: flex; justify-content: center; align-items: center; width: 100%; }
        .stimulus-img { max-width: 26%; max-height: 22vh; object-fit: contain; }
        .response-buttons { position: fixed; bottom: 40px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 56px; pointer-events: none; }
        .resp-btn { width: 180px; height: 180px; border-radius: 26px; font-size: 6rem; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; background-color: #3a6ea5; pointer-events: auto; cursor: pointer; box-shadow: 0 8px 24px rgba(77,163,255,0.28); }
        .resp-btn:active { background-color: #1e4a7a; transform: scale(0.95); }
        .rating-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .rating-num { width: 75px; height: 75px; background: #1e293b; color: #f8fafc; font-size: 28px; font-weight: bold; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #334155; transition: 0.1s; }
        #unified-instruction-overlay { position: fixed; inset: 0; background: #111; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 40px; display: none; }
        .header-area { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 180px 1fr 180px; align-items: center; margin-bottom: 20px; }
        .instruction-header { grid-column: 2; justify-self: center; text-align: center; font-size: 2rem; font-weight: bold; color: #4DA3FF; letter-spacing: 2px; margin: 0; }
        .guide-nav-btn { padding: 12px 32px; font-size: 1.4rem; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .guide-prev-btn { grid-column: 1; justify-self: start; background: #64748b; }
        .guide-next-btn { grid-column: 3; justify-self: end; background: #4DA3FF; }
        .guide-prev-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .next-step-btn { padding: 12px 32px; font-size: 1.4rem; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; background: #4DA3FF; }
        .next-step-btn:hover { background: #3a8de0; box-shadow: 0 0 15px rgba(77, 163, 255, 0.5); }
        .images-row { display: flex; justify-content: center; align-items: center; gap: 50px; width: 100%; max-width: 1200px; margin-bottom: 40px; position: relative; }
        .guide-img-wrapper { padding: 15px; border-radius: 12px; background: #222; transition: opacity 0.4s, transform 0.4s; opacity: 0.3; }
        .guide-img-wrapper.active { opacity: 1; transform: scale(1.05); background: #2a2a2a; }
        .guide-img-wrapper img { max-height: 40vh; width: auto; max-width: 100%; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.6); display: block; }
        #dynamic-red-box { position: absolute; border: 4px solid #FF3366; border-radius: 16px; pointer-events: none; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 0 25px rgba(255, 51, 102, 0.5); display: none; z-index: 10; }
        .subtitle-container { width: 100%; max-width: 1200px; background: #1a1a1a; border: 2px solid #333; border-radius: 15px; padding: 25px 40px; min-height: 140px; display: flex; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .subtitle-text { font-size: 1.6rem; line-height: 1.6; color: #eee; margin: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="unified-instruction-overlay">
        <div class="header-area"><button class="guide-nav-btn guide-prev-btn" id="guide-prev-btn" type="button">上一步</button><div class="instruction-header">【箭头判断】规则说明</div><button class="guide-nav-btn guide-next-btn next-step-btn" id="guide-next-btn" type="button">下一步</button></div>
        <div class="images-row" id="instruction-content">
            <div id="dynamic-red-box"></div>
            <div class="guide-img-wrapper" id="img-target-1"><img src="./instructions/01.png" onerror="this.style.display='none'"></div>
            <div class="guide-img-wrapper" id="img-target-2"><img src="./instructions/02_practice_start.png" onerror="this.style.display='none'"></div>
        </div>
        <div class="subtitle-container"><p class="subtitle-text" id="subtitle-text"></p></div>
    </div>
    <div id="app" style="width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;"></div>

<script src="./flanker_sequence.js?v=20260612-less-predictable"></script>
<script src="./flanker.js?v=20260624-corsi-flanker-sart-safe-only"></script>
</body>
</html>
